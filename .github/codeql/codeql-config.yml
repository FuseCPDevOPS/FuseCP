name: FuseCP CodeQL Config

paths-ignore:
  - "**/bin/**"
  - "**/obj/**"
  - "**/packages/**"
  - "FuseCP/Lib/**"
  - "**/CryptSharp/**"
  - "**/*ModelSnapshot.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Data/CodeTemplates/**"
  - "FuseCP/Sources/FuseCP.Build/**/*.cshtml"
  - "**/*.g.cs"
  # High-volume third-party vendor files (not owned, not fixable)
  - "**/Scripts/jquery-ui-*.js"
  - "**/App_Themes/**/addons/fuelux/**"
  - "**/JavaScript/jquery.window.js"
  - "**/App_Themes/**/js/jquery-ui/**"
  - "FuseCP/Sources/FuseCP.WebDavPortal/Scripts/DataTables/**"
  - "FuseCP/Sources/FuseCP.WebDavPortal/Scripts/jquery-*.js"
  - "FuseCP/Sources/FuseCP.WebPortal/App_Themes/Default/js/jquery/**"
  - "FuseCP/Sources/FuseCP.WebPortal/App_Themes/Default/js/fcp-common.js"
  - "FuseCP/Sources/FuseCP.WebPortal/JavaScript/jquery-*.js"
  - "FuseCP/Sources/FuseCP.WebDavPortal/Scripts/jquery.validate-vsdoc.js"
  - "FuseCP/Sources/FuseCP.WebPortal/App_Themes/Default/js/bootstrap/bootstrap.js"
  - "FuseCP/Sources/FuseCP.WebPortal/JavaScript/bootstrap/bootstrap.js"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Code/ExchangeServer/ExchangeServerController.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Code/Packages/PackageController.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Code/Servers/ServerController.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Code/Users/UserController.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Code/HostedSolution/OrganizationController.cs"
  - "FuseCP/Sources/FuseCP.Server.Utils/PInvoke.cs"
  - "FuseCP/Sources/FuseCP.Server.Utils/FileUtils.cs"
  - "FuseCP/Sources/FuseCP.Providers.Base/OS/WindowsOSInfo.cs"
  - "tools/MSBuildCommunityTasks/**"

query-filters:
  - exclude:
      id: cs/class-name-matches-base-class
