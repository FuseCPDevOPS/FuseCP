name: FuseCP CodeQL Config

paths-ignore:
  - "**/bin/**"
  - "**/obj/**"
  - "**/packages/**"
  - "FuseCP/Lib/**"
  - "**/CryptSharp/**"
  - "**/*ModelSnapshot.cs"
  - "FuseCP/Sources/FuseCP.EnterpriseServer.Data/CodeTemplates/**"
  - "FuseCP/Sources/FuseCP.Build/**/*.cshtml"
  # Third-party vendor JavaScript libraries — do not analyze
  - "**/Scripts/DataTables/**"
  - "**/Scripts/jquery-*.js"
  - "**/Scripts/jquery.*.js"
  - "**/Scripts/jquery-ui-*.js"
  - "**/App_Themes/**/js/jquery/**"
  - "**/App_Themes/**/js/bootstrap/**"
  - "**/App_Themes/**/addons/**"
  - "**/JavaScript/jquery.window.js"
  - "**/JavaScript/bootstrap/**"
  - "**/tinymce/**"
