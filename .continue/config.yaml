# =============================================================================
# Continue.dev Configuration for FuseCP
# Optimized for minimal token usage with on-demand rule loading
# =============================================================================
# Rule loading strategy:
#   - alwaysApply: true  -> loaded in EVERY conversation (~200 tokens)
#   - alwaysApply: false + globs -> loaded ONLY when matching files are in context
#   - alwaysApply: false (no globs) -> manual rules via @rules or /rules
# =============================================================================

name: FuseCP
version: 1.0.0
schema: v1

# ---------------------------------------------------------------------------
# MCP Servers (Smart Routing via ICT Shift Hub)
# ---------------------------------------------------------------------------
mcpServers:
  - name: ICT Shift Hub
    type: streamable-http
    url: https://ai-mcp.ictshift.net/mcp/$smart/MTiggelaar
    apiKey: mcphub_1feaa114a5a21cfdadfd7345f6e33a9de76ce8f8b9d11f90c52a2ffd7381ac2b

# ---------------------------------------------------------------------------
# ALWAYS-ON RULES - Minimal core (~200 tokens, always in context)
# ---------------------------------------------------------------------------
rules:
  - name: fusecp-core
    alwaysApply: true
    rule: |
      # FuseCP Core Rules
      - Keep changes minimal and task-focused. Preserve existing behavior.
      - Match existing architecture and coding style in the touched project.
      - Prefer root-cause fixes over cosmetic patches.
      - Validate null handling, error paths, and permission checks.
      - Keep backward compatibility in shared contracts unless explicitly approved.
      - Never expose secrets, credentials, tokens, or private tenant data.
      - Copyright header: Copyright (C) 2026 FuseCP
      - FuseCP migrates from SolidCP to ASP.NET Core. Solutions/projects split across FuseCP/Sources.
      - Prefer orchestrated builds (build.xml, build-debug.bat) over ad-hoc .sln builds.
      - Fast validation: pwsh -File FuseCP/Tools/run-local-validation.ps1 -ChangedOnly -SkipIfNoChanges -DisableNuGetAudit
      - Start of day: pwsh -File FuseCP/Tools/Start-Of-Day.ps1
      - Solution sync: pwsh -File FuseCP/Tools/check-sln-scope-sync.ps1

  # === ON-DEMAND: Database / EF / Migrations ===
  - name: database-workflow
    alwaysApply: false
    globs:
      - "FuseCP/Sources/FuseCP.EnterpriseServer.Data/**"
      - "FuseCP/Database/**"
      - "**/Entities/*.cs"
      - "**/Configuration/*.cs"
      - "**/Migrations/**"
      - "**/DbContext*.cs"
      - "**/install.*.sql"
      - "**/update_db.sql"
    rule: |
      # Database / EF Workflow
      ## Schema Changes Order
      1. Edit Entity classes in FuseCP.EnterpriseServer.Data/Entities/
      2. Update Fluent API in Configuration/ if needed
      3. Add ApplyConfiguration(model, new MyEntityConfiguration()); in DbContextBase.OnModelCreating()
      4. Add DbSet property in DbContext.Sets.cs
      5. Run MigrationAdd.bat for all 4 providers (SqlServer/MySql/PostgreSql/Sqlite)

      ## SQLite FK Constraint Rule
      PRAGMA foreign_keys = OFF is a no-op inside transactions. When deleting from parent tables
      (e.g. Providers), emit migrationBuilder.Sql(...) to delete child rows from non-cascading FK
      tables FIRST. Non-cascading FK tables to Providers: ServiceDefaultProperties, Services.

      ## Provider Removal Dependency Rule
      Never delete from Providers first. Handle ServiceDefaultProperties -> Services -> then Providers.
      Remap Services rows to replacement provider (preferred) or explicitly remove.

      ## Known Local Issues
      - MySQL: Bat hardcodes password but local has none. Re-run with Uid=root; (no Pwd).
      - SQL Server: "Stream was not readable" is pre-existing; CI regenerates correctly.
      - PostgreSQL: Host=localhost;Port=5433;User ID=postgres;Password=Password12

      ## Rules
      - Never hand-edit EF model snapshots or migration files.
      - install.*.sql are generated artifacts, not source of truth.
      - SQLite upgrades run through EF migrations only.
      - Verification automated via FuseCP/Tools/Orchestrate-Database-Workflow.ps1
      - Show both EF impact AND SQL impact in responses.

  # === ON-DEMAND: UI / LESS / CSS / Bootstrap ===
  - name: ui-styling
    alwaysApply: false
    globs:
      - "FuseCP/Sources/FuseCP.WebPortal/App_Themes/**"
      - "**/*.less"
      - "**/*.css"
      - "**/DesktopModules/FuseCP/**"
      - "FuseCP/Sources/FuseCP.WebPortal/**/*.ascx"
      - "FuseCP/Sources/FuseCP.WebPortal/**/*.aspx"
    rule: |
      # UI / Styling Workflow
      ## LESS Source Files (edit these)
      - main.less - main theme rules
      - Menus.less - navigation/menu
      - defaultVariables.less - shared LESS variables
      - defaultTheme.less - root entry point
      ## Compiled Output (NEVER edit directly): main.css
      ## Recompile: cd .../App_Themes/Default/Styles && npm run build:css
      ## Bootstrap 3 -> 5.3: Replace panel, well, input-group-addon, btn-default, pull-*,
      img-responsive, hidden-*, visible-*. Replace Glyphicons with Bootstrap Icons.

  # === ON-DEMAND: Build / Validation ===
  - name: build-validation
    alwaysApply: false
    globs:
      - "**/*.sln"
      - "**/*.csproj"
      - "**/*.vbproj"
      - "**/*.vcxproj"
      - "**/*.shproj"
      - "FuseCP/build.xml"
      - "FuseCP/build*.bat"
      - "FuseCP/deploy*.bat"
      - "FuseCP/Tools/*.ps1"
      - ".github/workflows/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
    rule: |
      # Build / Validation Workflow
      ## Scopes (smallest first): Portal, Enterprise, Server, Shared
      - Portal already builds FuseCP.WebPortalAndEnterpriseServer.sln
      ## Solution Sync: Keep FuseCP.sln synced with WebPortal/EnterpriseServer/Server .sln files
      ## Key Options: -ChangedOnly, -SkipIfNoChanges, -DisableNuGetAudit, -JsonOutputPath, -NoRestore
      ## Build Issues: If w3wp locks bin_dotnet use Unlock-WebPortal-Build.ps1
      ## Warning policy: prefer explicit fixes, never weaken dependencies to silence warnings
      ## Dependency/CVE: validate across net48, net10.0, netstandard2.0 and all scopes

  # === ON-DEMAND: Cleanup / Removal ===
  - name: cleanup-checklist
    alwaysApply: false
    globs:
      - "**/CHANGELOG*"
    rule: |
      # Complete Cleanup Checklist (removing features/providers/components)
      DO NOT perform partial removals. Must satisfy ALL:
      1. Solution Files: Remove from ALL .sln + ProjectConfigurationPlatforms
      2. Source Code: Delete source files and project directories
      3. Database: Remove EF seed, entities, configs, migrations (regenerate install scripts)
      4. Dependencies: Remove NuGet/assembly refs, unused usings
      5. Localization: Search Languages/Resources.xml for component strings
      6. Config/Docs: Update web.config, README, CHANGELOG, upgrade scenarios
      7. Build: Remove from build.xml, build/deploy scripts
      8. Tests: Delete test fixtures and examples
      9. Artifacts: Regenerate scope reports
      10. Provider Verification: Targeted build, verify contract stability

  # === ON-DEMAND: Exchange Providers ===
  - name: exchange-providers
    alwaysApply: false
    globs:
      - "FuseCP/Sources/FuseCP.Providers.HostedSolution.Exchange*/**"
      - "**/HostedSolution/Exchange*/**"
    rule: |
      # Exchange Provider Patterns
      - Provider Parity: Exchange 2013/2016/2019 share identical structure. Apply changes to ALL THREE.
      - PSObject Type Variance: NEVER direct cast on GetPSObjectProperty() results.
        Use: ObjToBoolean, ConvertByteSizePropertyToKB/MB, ConvertUnlimitedIntPropertyToInt32
      - No-Language Runspace: Guard ConfirmPreference and Get-MailboxSearch with try-catch + fallback.
      - Property Access: Prefer PSObject.Properties["name"] over PSObject.Members["name"].

  # === ON-DEMAND: PR Hygiene ===
  - name: pr-hygiene
    alwaysApply: false
    globs:
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "PR_DRAFT.md"
    rule: |
      # PR Hygiene
      - Include: summary, risk notes, exact validation commands, what was NOT validated
      - AI disclosure: tools used, parts generated/transformed, manual validation done
      - DB schema PRs: EF view + SQL view + provider retirement safety
      - Sanitize GitHub Actions artifact names
      - Use Create-Upstream-PR.ps1 for upstream PRs
      - Escalate: installer packaging, security defaults, multi-sln deps, major upgrades

  # === ON-DEMAND: Security ===
  - name: security-rules
    alwaysApply: false
    globs:
      - "**/Web.config"
      - "**/web.config"
      - "**/appsettings*.json"
      - "**/app.config"
      - "**/Security/**/*.cs"
      - "**/Authentication/**/*.cs"
    rule: |
      # Security Rules
      - Never commit secrets, credentials, connection strings, tokens, or tenant data.
      - Web.config: commit only structural/runtime-safe changes (ANCM wiring, handlers, non-secret defaults).
      - Keep secrets local-only; use sanitized commit-safe variants for git.
      - Runtime auth config: write to appsettings.hardened.json as narrow overlay.
      - Flag security-sensitive changes for maintainer review.

  # === ON-DEMAND: Legacy Context ===
  - name: legacy-context
    alwaysApply: false
    globs:
      - "**/LegacyScripts/**"
      - "SolidCP/**"
      - "**/update_db.sql"
      - "**/Migrate_msSQL.sql"
    rule: |
      # Legacy Context
      - FuseCP migrated from SolidCP. Check origin/SolidCPv1 branch for legacy behavior.
      - update_db.sql: legacy bridge for pre-v2.0.0 upgrades only.
      - LegacyScripts/master.update_db.sql: archival baseline, do not modify.
      - Migrate_msSQL.sql: legacy SQL Server module cleanup during upgrade scenarios.

# ---------------------------------------------------------------------------
# Custom Slash Commands - Common FuseCP workflows
# ---------------------------------------------------------------------------
customCommands:
  - name: validate
    description: Run fast local validation on changed files
    prompt: |
      Run the FuseCP local validation for the current changes:
      pwsh -File FuseCP/Tools/run-local-validation.ps1 -ChangedOnly -SkipIfNoChanges -DisableNuGetAudit
      Report what was validated and what could not be validated locally.

  - name: sln-sync
    description: Check solution file synchronization
    prompt: |
      Check if solution files are in sync:
      pwsh -File FuseCP/Tools/check-sln-scope-sync.ps1
      Report any synchronization issues found.

  - name: db-check
    description: Run database workflow verification
    prompt: |
      Run the automated database workflow verification:
      pwsh -File FuseCP/Tools/Orchestrate-Database-Workflow.ps1 -Mode Quick
      Report the EF and SQL impact, any migration issues, and known local generation exceptions.

  - name: cleanup-audit
    description: Audit completeness of a feature/provider removal
    prompt: |
      Review the current changes for completeness of removal. Check ALL of these:
      1. All .sln files - project declarations and ProjectConfigurationPlatforms removed
      2. Source files and project directories deleted
      3. EF seed data, entities, configs, migrations cleaned up
      4. NuGet/assembly references removed
      5. Languages/Resources.xml strings cleaned
      6. Config files (web.config, app.config) updated
      7. build.xml and build/deploy scripts updated
      8. Test fixtures and examples removed
      9. Generated reports noted as stale
      10. Provider contracts verified if applicable
      List any gaps found.

  - name: pr-prep
    description: Prepare PR description with validation summary
    prompt: |
      Help me prepare a PR description. Include:
      1. Concise summary of changes
      2. Risk assessment
      3. What was validated (exact commands)
      4. What was NOT validated locally
      5. AI disclosure (tools used, parts generated/transformed, manual validation)
      6. For DB changes: EF view + SQL view + provider retirement safety
      7. Solution sync status

  - name: start-of-day
    description: Run start-of-day routine
    prompt: |
      Run the FuseCP start-of-day routine:
      pwsh -File FuseCP/Tools/Start-Of-Day.ps1
      Report the status and any issues found.

# ---------------------------------------------------------------------------
# Docs context - Key documentation available via @docs
# ---------------------------------------------------------------------------
docs:
  - title: DATABASE_WORKFLOW_COMPLETE
    url: file:///./DATABASE_WORKFLOW_COMPLETE.md
  - title: AI_FUSECP_PLAYBOOK
    url: file:///./.github/AI_FUSECP_PLAYBOOK.md
  - title: CONTRIBUTING
    url: file:///./CONTRIBUTING.md
  - title: TESTING_ENVIRONMENT
    url: file:///./TESTING_ENVIRONMENT.md

# ============================================================================
# ADVANCED OPTIMIZATIONS - Agent Mode, Context Providers, Custom Commands
# ============================================================================
# NOTE: Configure your models (together.ai or others) via Continue.dev UI
# or set environment variables. This config focuses on features, not providers.

# ---------------------------------------------------------------------------
# Tab Autocomplete Configuration (Fast inline completions)
# ---------------------------------------------------------------------------
# Configure your autocomplete model in Continue.dev settings UI
# Recommended: Use a fast, low-cost model for autocomplete

tabAutocompleteOptions:
  # Fast response with minimal latency
  useFileSuffix: true
  maxPromptTokens: 2048
  debounceDelay: 300  # ms - balances responsiveness vs API calls
  prefixPercentage: 0.85
  maxSnippetPercentage: 0.7
  disableInComments: false
  useCache: true
  slidingWindowLines: 50
  multilineCompletions: always  # Enable multi-line completions
  templatePriority: automatic

# ---------------------------------------------------------------------------
# Agent Mode Configuration (Optimized tool usage)
# ---------------------------------------------------------------------------
experimental:
  defaultContext: activeCodebase

agentMode:
  toolPolicy:
    maxToolCallsPerTurn: 15  # Prevent infinite loops
    autoRetryOnFailure: true
    maxRetries: 2
  diffPolicy:
    showDiffBeforeApply: true
    requireApproval: false  # Set to true if you want manual approval
  fileEditPolicy:
    maxFileEditsPerTurn: 10
    backupBeforeEdit: true
  batchOperations:
    enabled: true
    maxBatchSize: 5

# ---------------------------------------------------------------------------
# Enhanced Context Providers (Rich @-mentions)
# ---------------------------------------------------------------------------
contextProviders:
  # Reference specific code files or functions
  - name: code
    description: Reference specific code files or functions
    params:
      maxFiles: 10
      includeGitIgnored: false
      
  # Semantic search across entire codebase
  - name: codebase
    description: Semantic search across entire codebase
    params:
      nRetrieve: 10
      nFinal: 5
      threshold: 0.7
      
  # Include git diff in context
  - name: diff
    description: Include git diff in context
    params:
      includeUnstaged: true
      
  # Reference entire folders
  - name: folder
    description: Reference entire folders
    params:
      maxDepth: 3
      maxFiles: 50
      
  # Fetch documentation from URLs
  - name: web
    description: Fetch content from web URLs
    params:
      timeout: 10000
      
  # Quick access to key documentation
  - name: docs
    description: Reference project documentation
    params:
      maxChunks: 10

# ---------------------------------------------------------------------------
# Codebase Indexing Configuration (Optimized for FuseCP)
# ---------------------------------------------------------------------------
indexing:
  # Focus on main source directories
  includePatterns:
    - "FuseCP/Sources/**/*.cs"
    - "FuseCP/Sources/**/*.vb"
    - "FuseCP/Sources/**/*.ps1"
    - "FuseCP/Tools/**/*.ps1"
    - "FuseCP/Sources/**/*.less"
    - "FuseCP/Sources/**/*.aspx"
    - "FuseCP/Sources/**/*.ascx"
    
  # Exclude build outputs and generated files
  excludePatterns:
    - "**/bin/**"
    - "**/obj/**"
    - "**/node_modules/**"
    - "**/packages/**"
    - "**/TestResults/**"
    - "**/*.dll"
    - "**/*.exe"
    - "**/*.pdb"
    - "**/*.log"
    - "FuseCP/Database/install.*.sql"  # Large generated files
    
  # Indexing strategy
  strategy:
    chunkSize: 1000
    chunkOverlap: 200
    embeddingBatchSize: 32
    reindexOnChange: true

# ---------------------------------------------------------------------------
# Advanced Custom Commands (Workflow automation)
# ---------------------------------------------------------------------------
customCommands:

  - name: review
    description: Comprehensive code review with security/performance focus
    prompt: |
      Review the current changes with focus on:
      
      **Security:**
      - SQL injection vulnerabilities
      - XSS/CSRF protection
      - Authentication/authorization issues
      - Sensitive data exposure
      - Input validation
      
      **Performance:**
      - N+1 query patterns
      - Unnecessary allocations
      - Inefficient algorithms
      - Missing indexes (if DB-related)
      - Memory leaks
      
      **Code Quality:**
      - SOLID principles adherence
      - Proper error handling
      - Null reference safety
      - Naming conventions
      - Code duplication
      
      **FuseCP Standards:**
      - Solution sync maintained
      - Build validation passes
      - Provider parity (if Exchange-related)
      - EF workflow compliance (if DB-related)
      
      Provide specific, actionable feedback with code examples.

  - name: refactor
    description: Safe refactoring with validation workflow
    prompt: |
      Refactor the selected code following these principles:
      
      1. **Preserve Behavior**: All existing functionality must work identically
      2. **Small Steps**: Make incremental changes, validate after each
      3. **Test Coverage**: Identify test gaps before refactoring
      4. **Validation Plan**: Specify which validation commands to run
      
      Refactoring goals (prioritize):
      - Reduce complexity
      - Improve readability
      - Eliminate duplication
      - Improve performance
      - Enhance testability
      
      After refactoring, provide:
      - Summary of changes
      - Validation commands to run
      - Risk assessment
      - Rollback plan if issues arise

  - name: explain
    description: Explain complex code patterns in detail
    prompt: |
      Explain the selected code in detail:
      
      1. **Purpose**: What problem does this code solve?
      2. **Flow**: Walk through the execution step-by-step
      3. **Dependencies**: What external systems/APIs does it use?
      4. **Edge Cases**: What scenarios could cause issues?
      5. **Performance**: What's the time/space complexity?
      6. **Alternatives**: Are there better approaches?
      
      Use diagrams or examples where helpful.
      Highlight any FuseCP-specific patterns or conventions.

  - name: test
    description: Generate comprehensive unit tests
    prompt: |
      Generate unit tests for the selected code:
      
      **Test Structure:**
      - Follow Arrange-Act-Assert pattern
      - One assertion per test (when possible)
      - Descriptive test names that explain the scenario
      
      **Coverage Goals:**
      - Happy path scenarios
      - Edge cases and boundary conditions
      - Error conditions and exceptions
      - Null/empty input handling
      - Permission/authorization checks
      
      **FuseCP Patterns:**
      - Use existing test infrastructure
      - Mock external dependencies appropriately
      - Follow naming conventions in existing tests
      - Include both positive and negative tests
      
      Provide complete, runnable test code with all necessary imports.

  - name: migrate
    description: Help with SolidCP to FuseCP migration patterns
    prompt: |
      Analyze this code for SolidCP to FuseCP migration:
      
      **Migration Checklist:**
      1. **Namespace Updates**: SolidCP.* to FuseCP.*
      2. **API Changes**: Identify deprecated/changed APIs
      3. **Configuration**: Web.config vs appsettings.json
      4. **Dependency Injection**: Update service registration
      5. **Async Patterns**: Convert synchronous to async where appropriate
      6. **Provider Model**: Ensure provider parity and patterns
      
      **Validation:**
      - Identify breaking changes
      - Suggest backward compatibility approaches
      - Provide migration script if applicable
      - List testing requirements
      
      Reference origin/SolidCPv1 branch for legacy behavior if needed.

  - name: debug
    description: Systematic debugging workflow
    prompt: |
      Help debug this issue systematically:
      
      **Step 1: Reproduce**
      - Exact steps to reproduce
      - Expected vs actual behavior
      - Environment details
      
      **Step 2: Isolate**
      - Minimal reproduction case
      - Recent changes that might have caused this
      - Related logs/error messages
      
      **Step 3: Analyze**
      - Code flow and potential failure points
      - Variable states at key points
      - Exception stack traces
      
      **Step 4: Fix**
      - Root cause identification
      - Proposed fix with explanation
      - Alternative solutions considered
      - Regression risk assessment
      
      **Step 5: Validate**
      - Test cases to verify the fix
      - Validation commands to run
      - Monitoring/logging to add

  - name: optimize
    description: Performance optimization analysis
    prompt: |
      Analyze this code for performance optimization:
      
      **Profile:**
      - Time complexity analysis
      - Space complexity analysis
      - Hot path identification
      - Bottleneck detection
      
      **Database (if applicable):**
      - Query optimization opportunities
      - Index recommendations
      - N+1 query detection
      - Batch operation opportunities
      
      **Memory:**
      - Allocation patterns
      - Large object heap usage
      - Disposal patterns
      - Cache opportunities
      
      **Async:**
      - Parallelization opportunities
      - Async/await best practices
      - Thread pool usage
      
      Provide specific optimizations with before/after code examples
      and expected performance improvements.

  - name: document
    description: Generate comprehensive documentation
    prompt: |
      Generate documentation for the selected code:
      
      **XML Documentation:**
      - Summary (what it does)
      - Parameters (with types and descriptions)
      - Return values
      - Exceptions that may be thrown
      - Usage examples
      
      **Additional Documentation:**
      - Architecture overview (if complex)
      - Integration points
      - Configuration requirements
      - Security considerations
      - Performance characteristics
      
      **FuseCP Standards:**
      - Follow existing documentation patterns
      - Include copyright header if applicable
      - Reference related documentation
      - Add to appropriate section of docs

# ---------------------------------------------------------------------------
# Usage Guide (Quick Reference)
# ---------------------------------------------------------------------------
# SLASH COMMANDS:
#   /validate        - Run fast local validation
#   /sln-sync        - Check solution synchronization
#   /db-check        - Verify database workflow
#   /cleanup-audit   - Audit feature removal completeness
#   /pr-prep         - Prepare PR description
#   /start-of-day    - Run start-of-day routine
#   /review          - Comprehensive code review
#   /refactor        - Safe refactoring workflow
#   /explain         - Explain complex code
#   /test            - Generate unit tests
#   /migrate         - SolidCP to FuseCP migration help
#   /debug           - Systematic debugging
#   /optimize        - Performance optimization
#   /document        - Generate documentation
#
# CONTEXT PROVIDERS (@-mentions):
#   @code filename   - Reference specific file
#   @codebase query  - Semantic search across codebase
#   @git             - Include git diff/history
#   @folder path     - Reference entire folder
#   @web url         - Fetch web content
#   @docs name       - Reference project docs
#
# TAB AUTOCOMPLETE:
#   - Starts automatically as you type
#   - Press Tab to accept suggestion
#   - Press Esc to dismiss
#   - Multi-line completions enabled
#   - Configure your model in Continue.dev settings
#
# AGENT MODE:
#   - Automatically uses tools when needed
#   - Shows diffs before applying changes
#   - Backs up files before editing
#   - Max 15 tool calls per turn
#
# TOKEN EFFICIENCY:
#   - On-demand rules load only when relevant
#   - Use specific @-mentions instead of full codebase
#   - Agent mode has retry limits to prevent loops
#
# MODEL CONFIGURATION:
#   - Configure models via Continue.dev UI settings
#   - Recommended for together.ai: Use fast models for autocomplete
#   - Recommended for chat/edit: Use capable models like Llama/Mistral
#
# BEST PRACTICES:
#   1. Run /start-of-day before starting work
#   2. Use /validate frequently during development
#   3. Use specific @-mentions for context
#   4. Run /pr-prep before creating pull requests
#   5. Use /review for important changes
#   6. Check /sln-sync when modifying project files
